[package]
name = "promptlab"
version = "1.0.0"
description = "promptLab 桌面版——造 Skill 的 IDE"
authors = ["Zhecheng Zhu"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "promptlab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
